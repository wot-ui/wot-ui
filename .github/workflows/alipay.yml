name: Upload To AlipayMiniProgram

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      description:
        description: '版本描述'
        required: false
        type: string
        default: '手动发布版本'
      branch:
        description: '要使用的分支'
        required: false
        type: string
        default: 'main'

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Alipay mini program
        run: pnpm build:mp-alipay

      - name: Upload Alipay mini program
        uses: wot-ui/ci@v0.5.3
        with:
          platform: alipay
          project-path: dist/build/mp-alipay
          appid: ${{ secrets.ALI_APPID }}
          tool-id: ${{ secrets.ALI_TOOL_ID }}
          private-key: ${{ secrets.ALI_PRIVATE_KEY }}
          platform-options: '{"autoincrement":true}'
          upload-desc: ${{ inputs.description || '自动发布版本' }}
          json: 'true'
          summary: ${{ runner.temp }}/alipay-upload-summary.md

      - name: Publish upload summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/alipay-upload-summary.md" ]]; then
            cat "$RUNNER_TEMP/alipay-upload-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
